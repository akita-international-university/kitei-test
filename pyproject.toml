[project]
name = "kitei-test"
version = "0.1.0"
description = "GitHubを用いた規程管理の可能性を検証するための試験環境。規程HTMLの取得・Markdown変換スクリプトを含む。"
authors = [{ name = "Taro Tsukagoshi", email = "ttsukagoshi@aiu.ac.jp" }]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[project.scripts]
getkitei = "scripts.get_kitei:main"
convert2markdown = "scripts.convert_to_markdown:main"
verifyconversion = "scripts.verify_conversion:main"
checkattachments = "scripts.check_attachments:main"
formatters = "scripts.format:main"
tests = "scripts.tests:main"

[tool.poetry]
packages = [{ include = "scripts" }]

[tool.black]
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-report=term-missing"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]
